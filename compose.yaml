# Docker's json-file driver keeps every line a container prints, with no size
# limit by default. Traefik's access log alone writes one line per request, so
# over months the disk fills and PostgreSQL stops accepting writes. Every
# service rotates at 10 MB and keeps five files (50 MB each at most).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    logging: *logging
    # Fixed addresses for the three components that may speak for a visitor.
    # The API trusts X-Forwarded-For from exactly these: Traefik for browser
    # calls, the storefront and admin servers for the calls they make while
    # rendering on a visitor's behalf. Trusting the whole network instead would
    # let any container spoof the header and mint a fresh rate-limit bucket per
    # request.
    networks:
      default:
        ipv4_address: ${SUBUL_NETWORK_PREFIX:?SUBUL_NETWORK_PREFIX is required}.10
    command:
      - --configFile=/etc/traefik/traefik.yml
    # Read by deploy/traefik/dynamic/routes.yml.
    environment:
      STORE_HOST: ${STORE_HOST:?STORE_HOST is required}
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST is required}
      TRAEFIK_ENTRYPOINT: web
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    depends_on:
      - api
      - admin
      - storefront

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Security state: rate-limit counters (and later, revoked tokens). noeviction
  # because an evicted key here silently weakens a control — a counter that
  # vanishes resets a brute-force window. The keys are tiny and all expire, so
  # 64 MB is far more than they need. No persistence: every key is short-lived.
  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --save ""
        --appendonly no
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory 64mb
        --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Output cache. The opposite policy: under memory pressure the least recently
  # used entries go, which is exactly what a cache is for.
  redis-cache:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --save ""
        --appendonly no
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema step: applies pending EF migrations with the api image, then
  # exits. `api` waits for it to succeed, so a failed migration stops the deploy
  # here instead of starting an API against a half-upgraded schema. It needs the
  # database and the JWT secret (Program.cs checks that before anything else) —
  # nothing else, since every other option is validated only on app.Run().
  migrate:
    image: subul-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    logging: *logging
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Staging}
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true;
      Jwt__Secret: ${JWT_SECRET:-}

  api:
    image: subul-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Staging}
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true;
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      ConnectionStrings__RedisCache: redis-cache:6379,password=${REDIS_CACHE_PASSWORD},abortConnect=false
      # Host-header allow-list: the two public hosts plus `api`, the name the
      # Next servers use inside the network. Anything else is refused with 400.
      # No CORS: both frontends reach the API on their own origin through
      # Traefik, and appsettings.json enables no origins outside Development.
      AllowedHosts: ${STORE_HOST};${ADMIN_HOST};api
      ForwardedHeaders__TrustedNetworks__0: ${SUBUL_NETWORK_PREFIX}.10
      ForwardedHeaders__TrustedNetworks__1: ${SUBUL_NETWORK_PREFIX}.11
      ForwardedHeaders__TrustedNetworks__2: ${SUBUL_NETWORK_PREFIX}.12
      Jwt__Secret: ${JWT_SECRET:-}
      Jwt__Issuer: ${JWT_ISSUER:-subul-admin}
      Jwt__Audience: ${JWT_AUDIENCE:-subul-admin-panel}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-480}
      AdminBootstrap__Enabled: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      AdminBootstrap__Name: ${ADMIN_BOOTSTRAP_NAME:-Administrator}
      AdminBootstrap__Email: ${ADMIN_BOOTSTRAP_EMAIL:-admin@subul.iq}
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:-}

  admin:
    image: subul-admin:${IMAGE_TAG:-local}
    build:
      context: ./client/admin-panel
      dockerfile: Dockerfile
      args:
        # Relative on purpose: the browser calls the API on the admin host
        # itself, so no host name is baked into the bundle.
        NEXT_PUBLIC_API_URL: /backend/api
        NEXT_PUBLIC_IMAGE_URL: ${PUBLIC_IMAGE_URL:-}
    restart: unless-stopped
    logging: *logging
    networks:
      default:
        ipv4_address: ${SUBUL_NETWORK_PREFIX}.12
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: /backend/api
      NEXT_PUBLIC_IMAGE_URL: ${PUBLIC_IMAGE_URL:-}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:5101/api}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: "true"

  storefront:
    image: subul-storefront:${IMAGE_TAG:-local}
    build:
      context: ./client/storefront
      dockerfile: Dockerfile
      args:
        # Relative, like the admin panel: the API shares the storefront host.
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_IMAGE_URL: ${PUBLIC_IMAGE_URL:-}
        INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:5101}
    restart: unless-stopped
    logging: *logging
    networks:
      default:
        ipv4_address: ${SUBUL_NETWORK_PREFIX}.11
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      NEXT_PUBLIC_IMAGE_URL: ${PUBLIC_IMAGE_URL:-}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:5101}

# One /24 per environment (SUBUL_NETWORK_PREFIX, e.g. 172.30.30), distinct so
# Development, Staging and Production can share a host. Fixed addresses:
# .10 traefik, .11 storefront, .12 admin; everything else is assigned from ip_range.
networks:
  default:
    ipam:
      config:
        - subnet: ${SUBUL_NETWORK_PREFIX}.0/24
          # Dynamic addresses come only from .128-.255, so no other container
          # can take a fixed address before its owner starts.
          ip_range: ${SUBUL_NETWORK_PREFIX}.128/25

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME is required}
  letsencrypt:

