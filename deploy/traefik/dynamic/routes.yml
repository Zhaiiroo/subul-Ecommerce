# Traefik routers. A Go template, rendered by Traefik's file provider from the
# container's environment (compose.yaml passes these in):
#
#   STORE_HOST          storefront host   e.g. 203-0-113-10.sslip.io, later the domain
#   ADMIN_HOST          admin host        e.g. admin.203-0-113-10.sslip.io
#   TRAEFIK_ENTRYPOINT  web (local, plain HTTP) or websecure (production, TLS)
#
# Moving to the final domain is therefore a change of two values in the env
# file; nothing here is edited. A request for any other host — including the
# bare server IP — matches no router and gets a 404, so the services are not
# reachable by address scanning.

http:
  routers:
    # The API shares the storefront's origin: the browser calls /api on the
    # same host it loaded the page from, so the storefront needs no CORS.
    store-backend:
      rule: 'Host(`{{ env "STORE_HOST" }}`) && (PathPrefix(`/api`) || PathPrefix(`/img`))'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: api
      middlewares: [security-headers]
      # Must outrank the storefront catch-all below.
      priority: 100

    store:
      rule: 'Host(`{{ env "STORE_HOST" }}`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: storefront
      middlewares: [security-headers]
      priority: 1

    # Same origin for the admin panel too, under /backend (see backend-prefix in
    # shared.yml for why not /api). No cross-origin call is left anywhere, so
    # the API runs with CORS switched off outside local development.
    admin-backend:
      rule: 'Host(`{{ env "ADMIN_HOST" }}`) && PathPrefix(`/backend`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: api
      middlewares: [backend-prefix, security-headers]
      priority: 100

    admin:
      rule: 'Host(`{{ env "ADMIN_HOST" }}`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: admin
      middlewares: [security-headers]
      priority: 1
