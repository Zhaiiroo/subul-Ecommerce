services:
  # Only 80 (redirect + Let's Encrypt challenge) and 443 are published. The
  # database, both Redis instances and every application container have no
  # host port at all.
  traefik:
    ports:
      - "80:80"
      - "443:443"
    environment:
      TRAEFIK_ENTRYPOINT: websecure
    volumes:
      - ./deploy/traefik/traefik.production.yml:/etc/traefik/traefik.yml:ro

  db:
    volumes:
      - ${DATABASE_BACKUP_PATH:?DATABASE_BACKUP_PATH is required}:/backups

  migrate:
    # Release images only: the server never builds, and never pulls an
    # application image from a registry — they come from the release archive.
    build: !reset null
    pull_policy: never
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:?APP_ENVIRONMENT is required}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}

  api:
    # Release images only: the server never builds, and never pulls an
    # application image from a registry — they come from the release archive.
    build: !reset null
    pull_policy: never
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:?APP_ENVIRONMENT is required}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      # Local until the final domain exists (R2 custom domains need a Cloudflare
      # zone), then R2. The R2 values are validated at startup only when the
      # provider is R2, so they may stay empty while it is Local.
      ImageStorage__Provider: ${IMAGE_STORAGE_PROVIDER:?IMAGE_STORAGE_PROVIDER is required}
      ImageStorage__R2__ServiceUrl: ${R2_SERVICE_URL:-}
      ImageStorage__R2__BucketName: ${R2_BUCKET_NAME:-}
      ImageStorage__R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      ImageStorage__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      ImageStorage__R2__PublicBaseUrl: ${PUBLIC_IMAGE_URL:-}
    # Uploaded images live on the host, outside Docker, next to the database
    # backups. The directory must be owned by UID 1654 (the api user):
    #   sudo install -d -o 1654 -g 1654 /srv/subul/img
    volumes:
      - ${UPLOADS_PATH:?UPLOADS_PATH is required}:/img

  admin:
    # Release images only: the server never builds, and never pulls an
    # application image from a registry — they come from the release archive.
    build: !reset null
    pull_policy: never
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # Auth.js builds its own URLs from the address the Next server listens on
      # (http://0.0.0.0:3000 in the container), so without this every signOut()
      # sent the user to a dead address. The panel's public origin fixes it.
      AUTH_URL: https://${ADMIN_HOST}

  storefront:
    # Release images only: the server never builds, and never pulls an
    # application image from a registry — they come from the release archive.
    build: !reset null
    pull_policy: never
