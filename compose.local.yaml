services:
  traefik:
    ports:
      - "127.0.0.1:${STOREFRONT_HOST_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_HOST_PORT:-8443}:443"
      - "127.0.0.1:${ADMIN_HOST_PORT:-3100}:3000"

  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ${DATABASE_BACKUP_PATH:-./backups/database}:/backups

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  api:
    pull_policy: build
    volumes:
      - ${LOCAL_UPLOADS_PATH:-./.runtime/staging/img}:/img

  admin:
    pull_policy: build

  storefront:
    pull_policy: build

