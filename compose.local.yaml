services:
  # One loopback port for both hosts: http://localhost:8080 is the storefront,
  # http://admin.localhost:8080 the admin panel (browsers resolve *.localhost to
  # loopback by themselves, so no hosts-file entry is needed).
  traefik:
    ports:
      - "127.0.0.1:${STOREFRONT_HOST_PORT:-8080}:80"

  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ${DATABASE_BACKUP_PATH:-./backups/database}:/backups

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  migrate:
    pull_policy: build

  api:
    pull_policy: build
    volumes:
      - ${LOCAL_UPLOADS_PATH:-./.runtime/staging/img}:/img

  admin:
    pull_policy: build

  storefront:
    pull_policy: build
